<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Taste | Knutey</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      background: #ffffff;
      font-family: "Avenir Next", Avenir, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .page {
      width: 100%;
      max-width: 1200px;
      padding: 34px 24px 24px 24px;
      box-sizing: border-box;
      display: flex;
      justify-content: center;
    }

    .header {
      position: relative;
      font-family: Avenir, "Avenir Next", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-weight: 700;
      font-size: 1.5rem;
      color: #222;
      margin: 0 0 30px 0;
      padding-bottom: 24px;
    }

    .header a {
      text-decoration: none;
      color: inherit;
    }

    .header::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100vw;
      height: 0.5px;
      background: #e0e0e0;
    }

    .layout {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 0;
      width: 100%;
    }

    .layout__top {
      display: flex;
      align-items: flex-start;
      gap: 0;
    }

    .movie-taste-card {
      width: 300px;
      min-width: 300px;
      height: 200px;
      flex-shrink: 0;
      padding: 16px 10px 16px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .movie-taste-card img {
      max-width: 224px;
      height: auto;
    }

    .about {
      width: 700px;
      margin-left: 40px;
      margin-top: 37px;
      font-family: "Avenir Next", Avenir, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .about h1 {
      margin: 0 0 24px 0;
      font-size: 1.75rem;
      font-weight: 500;
      color: #222;
    }

    .about__row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 12px 0;
      font-size: 1rem;
      font-weight: 400;
      color: #222;
      line-height: 1.5;
    }

    .about__row:last-child {
      margin-bottom: 0;
    }

    .about__description {
      margin: 32px 0 0 0;
      font-size: 1rem;
      font-weight: 400;
      color: #222;
      line-height: 1.6;
    }

    .about__icon {
      flex-shrink: 0;
      width: 1.25rem;
      height: 1.25rem;
      margin-right: 12px;
      color: #db6969;
    }

    .about__icon svg {
      width: 100%;
      height: 100%;
      stroke: currentColor;
    }

    .get-started-btn {
      display: inline-block;
      margin-top: 24px;
      padding: 12px 24px;
      background: #db6969;
      color: #fff;
      font-family: "Avenir Next", Avenir, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 1rem;
      font-weight: 500;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      text-decoration: none;
    }

    .get-started-btn:hover {
      background: #c75c5c;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="layout">
      <header class="header"><a href="index.html">Knutey</a></header>
      <div class="layout__top">
        <div class="movie-taste-card">
          <img src="assets/movie-taste.png" alt="Movie Taste by Knutey 2026">
        </div>
        <section class="about">
          <h1>Purpose</h1>
          <div class="about__row">
            <span class="about__icon" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/><path d="m12 13-1-1 2-2-3-3 2-2"/></svg>
            </span>
            <span>It takes too much time and effort to find movies and shows that are even worth watching.</span>
          </div>
          <div class="about__row">
            <span class="about__icon" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>
            </span>
            <span>See your taste in movies and shows and get personalized recommendations based upon what you like per genre.</span>
          </div>
          <button type="button" class="get-started-btn">Get Started</button>
        </section>
      </div>
    </div>
  </div>
</body>
</html>
